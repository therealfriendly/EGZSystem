<body>
<div id="grain"></div><div id="vig"></div>

<!-- ==================== HUD + CHECKLISTE ==================== -->
<header id="hud">
  <div class="hudrow">
    <div class="ring" id="ring"><span id="lvl">1</span></div>
    <div class="hudmid">
      <div class="rank" id="rank">NIEMAND</div>
      <div class="xpbar"><i id="xpfill"></i></div>
      <div class="xpnum" id="xpnum"></div>
    </div>
    <div class="streak"><b id="streakBadge">0</b><span>Serie</span></div>
  </div>
  <div class="chkrow">
    <div id="checks"></div>
    <button class="pen" id="editChecks" title="Checkliste bearbeiten">✎</button>
  </div>
</header>

<!-- ==================== SCREEN: HEUTE ==================== -->
<section class="screen on" id="s-run">
  <div class="wrap">
    <div class="panel">
      <div class="eyebrow"><span id="dstat">Checkliste offen</span><b id="dcount">0 Karten</b></div>
      <div id="cardArea"></div>
      <div id="controls"></div>
    </div>

    <div class="panel">
      <div class="eyebrow"><span>Felder im Stapel</span><b id="fcount"></b></div>
      <div id="cats" style="display:flex;flex-wrap:wrap;gap:6px"></div>
    </div>
  </div>
</section>

<!-- ==================== SCREEN: LOG ==================== -->
<section class="screen" id="s-log">
  <div class="wrap">
    <div class="panel">
      <div class="calhead">
        <button class="mini" id="prevM">◀</button><b id="monthLbl">—</b><button class="mini" id="nextM">▶</button>
      </div>
      <div class="cal" id="cal"></div>
      <div class="eyebrow" style="margin:12px 0 0">
        <span>Serie <b id="sk1">0</b> Tage · Rekord <b id="sk2">0</b></span><b id="jokerInfo">0 Joker</b>
      </div>
    </div>
    <div class="panel">
      <div class="eyebrow"><span id="dayLbl">Heute</span><b id="dayXp"></b></div>
      <div id="dayList"></div>
    </div>
  </div>
</section>

<!-- ==================== SCREEN: SHOP ==================== -->
<section class="screen" id="s-shop">
  <div class="wrap">
    <div class="panel">
      <div class="eyebrow"><span>Shop</span><b><span id="coins2">0</span> ◎</b></div>
      <div id="shopList"></div>
    </div>
    <div class="panel">
      <div class="eyebrow"><span>Rangleiter</span></div>
      <div id="ladder"></div>
    </div>
  </div>
</section>

<!-- ==================== SCREEN: ERFOLGE ==================== -->
<section class="screen" id="s-ach">
  <div class="wrap">
    <div class="panel">
      <div class="eyebrow"><span>Erfolge</span><b id="achCount"></b></div>
      <div id="achList"></div>
    </div>
  </div>
</section>

<!-- ==================== SCREEN: KARTEN ==================== -->
<section class="screen" id="s-cards">
  <div class="wrap">
    <div class="panel">
      <div class="eyebrow"><span>Kartenstapel</span><b id="deckCount"></b></div>
      <button class="btn" id="newCard">+ Neue Karte</button>
      <div id="cardFilter" style="display:flex;flex-wrap:wrap;gap:6px;margin:11px 0"></div>
      <div id="cardList"></div>
      <button class="mini wide" id="restoreDeck">Standard wiederherstellen</button>
    </div>
  </div>
</section>

<!-- ==================== SCREEN: PROFIL ==================== -->
<section class="screen" id="s-me">
  <div class="wrap">
    <div class="panel">
      <div class="eyebrow"><span>Profil</span><b id="meRank">—</b></div>
      <div id="meStats"></div>
    </div>
    <div class="panel"><div class="eyebrow"><span>Letzte 14 Tage</span></div><div class="bars" id="bars"></div></div>
    <div class="panel"><div class="eyebrow"><span>Verteilung</span></div><div class="dist" id="dist"></div></div>
    <div class="panel"><div class="eyebrow"><span>Protokoll</span><b id="histCount"></b></div><div id="hist"></div></div>
    <div class="panel">
      <div class="eyebrow"><span>Daten</span></div>
      <div class="btnrow" style="margin-bottom:8px">
        <button class="mini" id="expBtn">Export</button>
        <button class="mini" id="impBtn">Import</button>
        <button class="mini" id="sndBtn">Sound</button>
      </div>
      <textarea id="io" placeholder="Sicherung: Export drücken, Text kopieren. Zum Zurückspielen Text einfügen und Import drücken."></textarea>
      <button class="mini wide danger" id="resetBtn">Alles löschen</button>
    </div>
  </div>
</section>

<!-- ==================== OVERLAYS ==================== -->
<div id="toast"></div>
<div id="modal"></div>
<div id="flash"><div>
  <div class="lvl">Aufstieg</div>
  <div class="big" id="flashBig">2</div>
  <div class="sub" id="flashSub">—</div>
  <button class="mini" style="margin-top:20px;padding:11px 24px" id="flashOk">Weiter</button>
</div></div>

<!-- ==================== NAV ==================== -->
<nav id="nav">
  <button data-s="s-run"   class="on" style="--tc:#00ffa3"><i>◈</i>Heute</button>
  <button data-s="s-log"   style="--tc:#00e5ff"><i>▦</i>Log</button>
  <button data-s="s-shop"  style="--tc:#ffc233"><i>◎</i>Shop</button>
  <button data-s="s-ach"   style="--tc:#ff8a3d"><i>★</i>Erfolge</button>
  <button data-s="s-cards" style="--tc:#a86bff"><i>⬡</i>Karten</button>
  <button data-s="s-me"    style="--tc:#ff2e63"><i>◉</i>Profil</button>
</nav>
